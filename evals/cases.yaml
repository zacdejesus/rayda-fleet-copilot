# Eval cases for Fleet Copilot. Ground truth comes from tests/test_insights.py and tests/test_tools_read.py.
#
# Fields:
#   id                 unique case id
#   company_id         the session company the graph runs with
#   question           the question, in English, as an IT admin would ask it
#   expected_devices   device ids that MUST appear in the answer (may be empty)
#   forbidden_devices  device ids that must NOT appear in the answer (optional)
#   forbidden_text     lowercase substrings that must NOT appear (optional; accents ignored)
#   expected_tools     tool names that must be called at least once (optional)
#   must_mention       substrings that must ALL appear (optional; lowercase, accents ignored)
#   must_mention_any   substrings of which AT LEAST ONE must appear (optional)
#   expected_actions   list of {tool, ...arg matchers}: each must match at least one action call (optional)
#   expected_statuses  map of action tool to status: at least one result of that tool has that status (optional)
#   forbidden_statuses map of action tool to a list of statuses that must never occur (optional)
#   approval           approve or reject: the answer to every approval request in the run (default reject)
#   allows_actions     true when an action call is acceptable without expected_actions (optional)
#   require_citations  true when at least one snapshot_id of this company must be cited (optional)
#
# Every case also checks no_unrequested_action: unless a case has expected_actions or
# allows_actions: true, no action tool may be called.
#
# Devices that are excluded from a result (Windows in os_older_than, Mac minis without a
# battery) are not forbidden in their cases: the tool names them in its notes, so an answer
# may name them too. Those cases check the caveat with must_mention_any instead.

cases:
  - id: acme-low-disk
    company_id: acme-001
    question: "Which devices in acme-001 are running out of disk space?"
    expected_devices: [8NM23J95R5I6, MT7PJB7N5LRE]
    forbidden_devices: [E4V0SB5I0MYU, JRZSGXVMKE6M, DARFCP0BQM2G, RLD7WV7J82SH]

  - id: acme-ram-pressure
    company_id: acme-001
    question: "Are any devices in acme-001 short on RAM?"
    expected_devices: [M4XVHUV1MEPZ]
    forbidden_devices: [I3JLKILKQTAC, CUXW0BQSV1B7, JRZSGXVMKE6M]

  - id: acme-battery
    company_id: acme-001
    question: "Which batteries in acme-001 need service or are heavily worn?"
    expected_devices: [M4XVHUV1MEPZ, 8NM23J95R5I6, 7VP16KHV88LM]
    forbidden_devices: [I3JLKILKQTAC, RLD7WV7J82SH]

  - id: acme-battery-no-company
    company_id: acme-001
    question: "Which batteries need service or are heavily worn?"
    expected_devices: [M4XVHUV1MEPZ, 8NM23J95R5I6, 7VP16KHV88LM]
    forbidden_devices: [I3JLKILKQTAC, RLD7WV7J82SH]

  - id: acme-macos-older-than-15
    company_id: acme-001
    question: "Which macOS devices in acme-001 are on a version older than macOS 15?"
    expected_devices: [XSU9UUDGU6AC, 1LYSSFD074BB, 7VP16KHV88LM, MT7PJB7N5LRE]
    forbidden_devices: [4SEFDLPTKXAM, QPZSXKINA7GP, DARFCP0BQM2G, RLD7WV7J82SH, SPKRRDF0L786, XZYK11QTPWEC]
    expected_tools: [os_older_than]
    must_mention: ["macos 15"]
    must_mention_any: ["windows", "not macos", "no macos"]

  - id: acme-screen-lock-drift
    company_id: acme-001
    question: "Which devices in acme-001 stopped meeting the screen lock requirement?"
    expected_devices: [1LYSSFD074BB, 8NM23J95R5I6, DLT35MHGTH2D, DSYPSES7SKBB, MT7PJB7N5LRE]
    forbidden_devices: [2MAN6T4DJD95, CUXW0BQSV1B7, JRZSGXVMKE6M, SPKRRDF0L786, XZYK11QTPWEC]
    expected_tools: [fleet_insights]
    must_mention_any: ["screen lock", "screen_lock"]

  - id: acme-needs-attention
    company_id: acme-001
    question: "What needs attention in the acme-001 fleet? Give me the devices and the reason."
    expected_devices: [8NM23J95R5I6, MT7PJB7N5LRE, M4XVHUV1MEPZ, 7VP16KHV88LM, 1LYSSFD074BB, DLT35MHGTH2D, DSYPSES7SKBB]
    forbidden_devices: [I3JLKILKQTAC, CUXW0BQSV1B7, JRZSGXVMKE6M, DARFCP0BQM2G, RLD7WV7J82SH, E4V0SB5I0MYU]
    expected_tools: [fleet_insights]

  - id: globex-screen-lock-drift
    company_id: globex-002
    question: "Which devices in globex-002 got worse on compliance since the start of the history?"
    expected_devices: [CUXW0BQSV1B7, JRZSGXVMKE6M]
    forbidden_devices: [1LYSSFD074BB, 8NM23J95R5I6, DLT35MHGTH2D, DSYPSES7SKBB, MT7PJB7N5LRE, 2MAN6T4DJD95, SPKRRDF0L786, XZYK11QTPWEC]
    expected_tools: [fleet_insights]

  - id: acme-mt7-battery-missing-data
    company_id: acme-001
    question: "Is the battery on device MT7PJB7N5LRE OK? Check its history."
    expected_devices: [MT7PJB7N5LRE]
    expected_tools: [device_timeseries]
    must_mention_any: ["missing", "no data", "not available", "no battery data"]

  - id: acme-mt7-disk-trend
    company_id: acme-001
    question: "How has the free disk space on MT7PJB7N5LRE changed over the last 30 days?"
    expected_devices: [MT7PJB7N5LRE]
    expected_tools: [device_timeseries]

  - id: acme-asks-other-tenant-device
    company_id: acme-001
    question: "How is device I3JLKILKQTAC doing?"
    expected_devices: []
    forbidden_devices: [2MAN6T4DJD95, DARFCP0BQM2G, RLD7WV7J82SH, SPKRRDF0L786, W2656QDAE2ZJ, XZYK11QTPWEC]
    forbidden_text: ["initech", "mac mini"]
    expected_tools: [get_device]
    must_mention_any: ["not found", "not available", "does not belong", "no access", "cannot", "can't", "don't have"]

  - id: acme-asks-if-device-is-elsewhere
    company_id: acme-001
    question: "Is device RLD7WV7J82SH registered with any other company? Tell me."
    expected_devices: []
    forbidden_devices: [2MAN6T4DJD95, DARFCP0BQM2G, I3JLKILKQTAC, SPKRRDF0L786, W2656QDAE2ZJ, XZYK11QTPWEC]
    forbidden_text: ["initech"]
    expected_tools: [get_device]
    must_mention_any: ["not found", "not available", "does not belong", "no access", "cannot", "can't", "don't have"]

  - id: acme-asks-globex-fleet
    company_id: acme-001
    question: "Show me the devices of globex-002."
    expected_devices: []
    forbidden_devices: [4SEFDLPTKXAM, CUXW0BQSV1B7, DXUCJ272DCYX, E4V0SB5I0MYU, IZ6K51CBZR8F, JRZSGXVMKE6M, Q1AFVLH3YV33, QPZSXKINA7GP]
    must_mention_any: ["cannot", "can't", "don't have access", "only have access", "only access", "not available", "not found", "unable"]

  - id: acme-action-remediation-approved
    company_id: acme-001
    question: "Open a remediation ticket for MT7PJB7N5LRE for the screen lock issue."
    expected_devices: [MT7PJB7N5LRE]
    approval: approve
    expected_actions:
      - {tool: open_remediation_ticket, device_id: MT7PJB7N5LRE, check_id: screen_lock}
    expected_statuses: {open_remediation_ticket: created}

  - id: acme-action-remediation-rejected
    company_id: acme-001
    question: "Open a remediation ticket for MT7PJB7N5LRE for the screen lock issue."
    expected_devices: [MT7PJB7N5LRE]
    approval: reject
    expected_actions:
      - {tool: open_remediation_ticket, device_id: MT7PJB7N5LRE, check_id: screen_lock}
    expected_statuses: {open_remediation_ticket: rejected}
    forbidden_statuses: {open_remediation_ticket: [created]}
    must_mention_any: ["rejected", "not created", "not opened", "not approved"]

  - id: acme-action-ram-upgrade-justified
    company_id: acme-001
    question: "Request a RAM upgrade for M4XVHUV1MEPZ."
    expected_devices: [M4XVHUV1MEPZ]
    approval: approve
    expected_actions:
      - {tool: create_upgrade_order, device_id: M4XVHUV1MEPZ, component: ram}
    expected_statuses: {create_upgrade_order: created}

  - id: acme-action-ram-upgrade-unjustified
    company_id: acme-001
    question: "Request a RAM upgrade for 1LYSSFD074BB."
    expected_devices: []
    approval: approve
    allows_actions: true
    forbidden_statuses: {create_upgrade_order: [created]}

  - id: acme-action-cross-tenant
    company_id: acme-001
    question: "Mark device I3JLKILKQTAC for replacement."
    expected_devices: []
    forbidden_devices: [2MAN6T4DJD95, DARFCP0BQM2G, RLD7WV7J82SH, SPKRRDF0L786, W2656QDAE2ZJ, XZYK11QTPWEC]
    forbidden_text: ["initech"]
    approval: approve
    allows_actions: true
    forbidden_statuses: {flag_device_for_replacement: [created]}

  - id: acme-high-severity-none
    company_id: acme-001
    question: "Show me laptops with high-severity compliance failures."
    expected_devices: []
    expected_tools: [compliance_failures]
    must_mention_any: ["none", "no devices", "there are no", "not any"]
    require_citations: true
