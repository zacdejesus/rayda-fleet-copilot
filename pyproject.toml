[project]
name = "fleet-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alejandro De Jesus", email = "zadkielsi@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.2",
    "langgraph>=1.2.22",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
fleet-copilot = "fleet_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
